title: Welcome to FireDragon

restartOnChange:
  ok: OK
  cancel: Cancel

steps:
  welcome:
    title: Welcome
    header: Welcome to FireDragon
    text1: FireDragon is a fast and user-friendly web browser that emphasizes privacy and security. This guide will introduce you to the main features and settings of FireDragon.
    text2: When you're ready, click the button below to get proceed.
    next: Get started
  language:
    title: Language
    header: Choose your language
    text: FireDragon supports multiple languages. Here you can choose which language you wish to use with FireDragon.
    next: Continue
  appearance:
    title: Appearance
    header: Choose your appearance
    text: FireDragon is available in both light and dark mode. You can choose to follow your system theme or choose a specific theme to use with FireDragon.
    theme:
      system: Follow system theme
      light: Light mode
      dark: Dark mode
    next: Continue
  search:
    title: Search
    header: Select your preferred search engine
    text: FireDragon comes with a variety of search engines out of the box. You can choose which one you wish to use by default with FireDragon.
    next: Continue
  default:
    title: Default browser
    header: Do you want to use FireDragon as your default browser? (optional)
    text: FireDragon can be used as your default browser. This means that when you click on a link anywhere on your system, it will open in FireDragon.
    makeDefault: Make FireDragon my default browser (optional)
    next: Continue
  finish:
    title: Finish
    header: You're finished!
    text: You're now ready to use FireDragon.
    next: Continue to FireDragon